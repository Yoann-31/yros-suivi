<!doctype html>
<!-- YROs : page de suivi en direct (AC.1, 3.86). Publiée telle quelle sur GitHub Pages (dépôt public
     « yros-suivi »). Elle ne contient aucun secret : le lien porte, après le #, l'identifiant du script
     Google du propriétaire et celui du partage. La position est lue en JSON par fetch, SANS cookies :
     le bug « Impossible d'ouvrir le fichier » des navigateurs connectés à plusieurs comptes Google
     ne la touche pas. Marqueur lu par l'app pour savoir que la page est en ligne : yros-suivi-v1 -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>YROs · position en direct</title>
<style>
  :root { --bg:#0b0b0d; --card:#17171b; --text:#f4efe6; --muted:#b9b2a6; --gold:#d8b46a; --sos:#b3123a; --line:#2a2a30; }
  @media (prefers-color-scheme: light) { :root { --bg:#faf7f1; --card:#ffffff; --text:#1b1a17; --muted:#5d574d; --gold:#8a6a22; --sos:#a3102f; --line:#e4ddd0; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  h1 { font-size:22px; margin:8px 0 12px; }
  .sos { background:var(--sos); color:#fff; padding:14px 16px; border-radius:14px; font-weight:700; font-size:19px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px; margin:12px 0; }
  #map { width:100%; height:360px; border:0; border-radius:16px; background:var(--card); display:block; }
  a.btn { display:block; text-align:center; background:var(--gold); color:#1b1a17; text-decoration:none; font-weight:700;
          padding:14px; border-radius:999px; margin:12px 0; }
  .muted { color:var(--muted); font-size:15px; }
</style>
</head>
<body>
<main id="page">
  <h1 id="title">YROs</h1>
  <div id="banner"></div>
  <p id="info" class="card">…</p>
  <iframe id="map" title="Carte" hidden></iframe>
  <a id="gmaps" class="btn" target="_blank" rel="noopener" hidden></a>
  <p id="note" class="muted"></p>
</main>
<script>
(function () {
  var en = !/^fr/i.test(navigator.language || 'fr');
  var T = en ? {
    title: ' is sharing their location', sos: '🆘 SOS: {n} needs help', ended: 'Location sharing ended',
    endedText: 'This link is no longer active.', locating: 'Locating… Sharing until {u}.',
    updated: 'Updated {a} ago{p}. Sharing until {u}.', acc: ' (accuracy {m} m)', open: 'Open in Google Maps',
    note: 'This page refreshes by itself. If the location stops moving, the phone may be off: the last known location stays shown.',
    bad: 'This link is incomplete. Use the full link received by SMS.', net: 'No connection to the server. Retrying…', who: 'Someone'
  } : {
    title: ' partage sa position', sos: '🆘 SOS en cours : {n} a besoin d’aide', ended: 'Partage de position terminé',
    endedText: 'Ce lien n’est plus actif.', locating: 'Localisation en cours… Partage jusqu’à {u}.',
    updated: 'Mise à jour il y a {a}{p}. Partage jusqu’à {u}.', acc: ' (précision {m} m)', open: 'Ouvrir dans Google Maps',
    note: 'La page s’actualise seule. Si la position ne bouge plus, le téléphone est peut-être éteint : la dernière position connue reste affichée.',
    bad: 'Ce lien est incomplet. Utilisez le lien entier reçu par SMS.', net: 'Pas de connexion au serveur. Nouvel essai…', who: 'Quelqu’un'
  };
  function $(id) { return document.getElementById(id); }
  function fill(s, o) { return s.replace(/\{(\w)\}/g, function (_, k) { return o[k] == null ? '' : o[k]; }); }
  // Lien : …/yros-suivi/#<identifiant du script>.<identifiant du partage>
  var m = /^#([A-Za-z0-9_-]{10,120})\.([A-Za-z0-9_-]{16,64})$/.exec(location.hash);
  if (!m) { $('info').textContent = T.bad; return; }
  var url = 'https://script.google.com/macros/s/' + m[1] + '/exec?json=1&live=' + encodeURIComponent(m[2]);
  var timer = null;
  function ended() {
    clearInterval(timer);
    $('title').textContent = T.ended; $('banner').textContent = ''; $('banner').className = '';
    $('info').textContent = T.endedText; $('map').hidden = true; $('gmaps').hidden = true; $('note').textContent = '';
    document.title = 'YROs · ' + T.ended;
  }
  function show(d) {
    var who = d.name || T.who;
    if (d.sos) { $('banner').className = 'sos'; $('banner').textContent = fill(T.sos, { n: who }); $('title').textContent = ''; }
    else { $('banner').className = ''; $('banner').textContent = ''; $('title').textContent = who + T.title; }
    document.title = d.sos ? 'YROs · SOS' : 'YROs · ' + who;
    $('note').textContent = T.note;
    if (d.pending) { $('info').textContent = fill(T.locating, { u: d.until }); return; }
    var lat = Number(d.lat), lng = Number(d.lng);
    if (!isFinite(lat) || !isFinite(lng)) return;
    var a = d.agoS < 60 ? d.agoS + ' s' : Math.round(d.agoS / 60) + ' min';
    $('info').textContent = fill(T.updated, { a: a, p: d.acc ? fill(T.acc, { m: d.acc }) : '', u: d.until });
    var k = 0.004, ll = lat + ',' + lng;
    var src = 'https://www.openstreetmap.org/export/embed.html?bbox=' + [lng - k, lat - k, lng + k, lat + k].join(',') + '&layer=mapnik&marker=' + ll;
    var map = $('map');
    if (map.getAttribute('src') !== src) map.setAttribute('src', src);
    map.hidden = false;
    var g = $('gmaps'); g.href = 'https://maps.google.com/?q=' + ll; g.textContent = T.open; g.hidden = false;
  }
  function load() {
    fetch(url, { credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer' })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j && j.live) show(j.live); else if (j && j.ended) ended(); })
      .catch(function () { if ($('map').hidden) $('info').textContent = T.net; });
  }
  load();
  timer = setInterval(load, 15000);
})();
</script>
</body>
</html>
